name: Model tests

on:
  push:
    branches: [main, codex/share-notes, codex/ui-language]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-tests:
    name: Java 21 model checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and run model checks
        shell: pwsh
        run: ./test-model.ps1
